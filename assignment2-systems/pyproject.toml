[project]
name = "cs336-systems"
version = "26.1.4"
description = "CS336 Assignment 2 - Systems"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cs336-basics",
    "humanfriendly",
    "matplotlib",
    "numpy",
    "pytest>=8",
    "regex>=2026.3.32",
    "torch~=2.13.0",
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "pandas>=2",
    "ty>=0.0.29",
    "ruff>=0.15.10",
    "triton>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs336_systems"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"
# 新增：全局索引策略，从所有索引中取最高兼容版本（解决版本冲突）
index-strategy = "unsafe-best-match"

# ------------------- 索引定义 -------------------
# 1. PyPI 镜像（清华源，加速下载）
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"   # 改为清华镜像
default = true                                     # 设为默认索引

# 2. PyTorch 官方 CUDA 130 索引（仅用于 torch 相关包）
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true                                    # 仅当 sources 中显式指定时才使用

# ------------------- 包来源映射 -------------------
[tool.uv.sources]
# 本地开发依赖（请确保路径正确）
cs336-basics = { path = "./cs336-basics", editable = true }
# 指定 torch 系列从 PyTorch 索引安装
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
# tqdm 明确从 PyPI（清华镜像）获取，避免版本冲突
tqdm = { index = "pypi" }

# ------------------- 测试与 Lint 配置（保持不变） -------------------
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore:Attempting to run cuBLAS:UserWarning",
    "ignore:TensorFloat32:UserWarning",
]

[tool.ruff]
line-length = 180

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]